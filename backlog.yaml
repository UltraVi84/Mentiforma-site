tasks:
  - id: task-4516
    title: Шапка, навигация и hero-блок
    description: >-
      Создать первый видимый экран лендинга Mentiforma.

      Шапка: слева логотип (стилизованный мозг из печатных плат и нейронных
      связей, градиент от неоново-голубого к мадженте, текст «MENTIFORMA» белый
      геометрический, буква «А» без перекладины; если SVG-логотип не удастся
      сгенерировать — плейсхолдер с alt-текстом «Mentiforma — логотип»), меню
      «Услуги, Преимущества, Кейсы, Контакты» и кнопка «Обсудить проект». Все
      пункты меню — рабочие анкоры к секциям (id: services, why-us, cases,
      pricing, faq, contacts) с плавной прокруткой. На мобильной ширине меню
      сворачивается в гамбургер, который открывается и закрывается по клику.

      Hero-блок: надзаголовок моноширинный неоновый «MENTIFORMA. РАЗУМ СОЗДАЁТ
      ФОРМУ.», заголовок H1 «Разум создаёт форму. Форма продаёт.», подзаголовок
      «AI-студия одного эксперта. Креатив, реклама, вебинары, чат-боты — весь
      digital-цикл без менеджеров и согласований. Нейросети ускоряют, эксперт
      отвечает за результат.». Две кнопки: «Наши услуги» (заливка, ведёт к
      секции услуг) и «Получить консультацию» (контурная, ведёт к секции
      контактов). Фон — тёмный градиент с полупрозрачным нейросетевым паттерном.

      Остальные секции страницы на этом этапе реализовывать не нужно.
    status: completed
    acceptance_criteria:
      - Шапка отображается с логотипом, меню из 4 пунктов и кнопкой «Обсудить
        проект»
      - Клик по каждому пункту меню плавно прокручивает к соответствующей
        секции; кнопка «Обсудить проект» тоже ведёт к контактам
      - На мобильной ширине меню сворачивается в гамбургер; открытие и закрытие
        работают
      - Hero-блок отображает надзаголовок, H1 и подзаголовок с точными текстами
      - Кнопки «Наши услуги» и «Получить консультацию» ведут к своим секциям и
        имеют неоновое свечение при наведении
      - Фон hero — тёмный градиент с полупрозрачным нейросетевым паттерном
    summary: "Реализованы шапка и hero-блок лендинга Mentiforma. Шапка
      (components/site-header.tsx): SVG-логотип мозга с градиентом и вордмарк
      MENTIFORMA с «А» без перекладины (components/logo.tsx), меню-анкоры
      (services, why-us, cases, contacts) с плавной прокруткой и кнопка
      «Обсудить проект»; на мобильной ширине — гамбургер. Hero
      (components/hero.tsx): надзаголовок, H1, подзаголовок и две кнопки с
      неоновым свечением на тёмном градиенте с нейросетевым паттерном. Палитра
      Lilac Neon и утилиты добавлены в app/globals.css, шрифты и layout — в
      app/layout.tsx. Typecheck, lint и build проходят."
  - id: task-6997
    title: Секция «Услуги»
    description: >-
      Создать секцию услуг (id: services) с заголовком «Комплексные решения для
      роста». 4 карточки в ряд, каждая с линейной SVG-иконкой (без emoji),
      названием, описанием, списком из 5 подуслуг и ценой:

      1. «AI-продакшн под ключ» — описание «Создаём весь креативный контент для
      вашего бренда с помощью нейросетей: от логотипа и презентаций до
      музыкальных треков и оживления архивных фото. Быстро, в единой стилистике,
      без найма десятка подрядчиков.» Подуслуги: логотипы и брендинг (от 3
      дней), дизайн презентаций (до 20 слайдов), карточки товаров ��ля
      маркетплейсов (комплект от 10 позиций), реставрация и оживление фото (до
      20 фото), музыкальные треки (до 3 минут, с правами). Цена: от 45 000 ₽ за
      пакет, точный расчёт после брифа.

      2. «Реклама в Яндекс Директ» — описание «Приведём горячих клиентов, а не
      просто сольём бюджет. Настраиваю кампании под ключ, веду и оптимизирую
      еженедельно. Прозрачная аналитика: вы видите, откуда пришёл каждый лид и
      сколько он стоил.» Подуслуги: настройка кампаний с нуля (5–7 дней),
      ведение и оптимизация (минимум 1 месяц), сквозная аналитика (Метрика,
      цели, коллтрекинг, CRM), медиапланирование (CPL, ROMI), аудит текущих
      кампаний (3 дня). Цена: от 35 000 ₽ за настройку + рекламный бюджет,
      ведение — от 25 000 ₽/мес.

      3. «Модерация и техподдержка вебинаров» — описание «Проведёте эфир
      безупречно, даже если у вас 1000+ участников. Беру на себя всю техническую
      рутину: от подключения спикеров до монтажа записи.» Подуслуги:
      техподдержка спикеров (репетиция за час до старта), модерация чата,
      продающие комнаты и сопровождение сделок в прямом эфире, запись и монтаж
      трансляции (готовый материал через 48 часов), технический чек-лист (Zoom,
      Webinar.ru, YouTube, VK Live). Цена: от 15 000 ₽ за мероприятие, пакет на
      4 эфира в месяц — от 50 000 ₽.

      4. «Разработка чат-ботов» — описание «Автоматизируем продажи и поддержку
      24/7. Бот не спит, не устаёт и не теряет заявки. Настраиваю под ваши
      бизнес-процессы.» Подуслуги: боты для продаж (amoCRM, Bitrix24), боты для
      поддержки, квизы и автоворонки, интеграции (Telegram, WhatsApp, VK,
      ЮKassa, CloudPayments), аналитика и доработка. Цена: от 25 000 ₽ за бота,
      поддержка — от 10 000 ₽/мес.

      На планшете и мобильном карточки аккуратно перестраиваются.
    status: completed
    acceptance_criteria:
      - Отображаются 4 карточки с иконками, названием, описанием, 5 подуслугами
        и ценой по текстам брифа
      - Иконки — линейные SVG, без emoji
      - Карточки аккуратно перестраиваются на планшете и мобильном
    summary:
      "Реализована секция «Услуги» (id: services) в components/services.tsx,
      подключена в app/page.tsx. Заголовок «Комплексные решения для роста» и 4
      карточки (AI-продакшн, Яндекс Директ, вебинары, чат-боты) с линейными
      SVG-иконками с градиентом бренда, названием, описанием, 5 подуслугами и
      ценой по текстам брифа. Сетка grid-cols-1 / md:grid-cols-2 /
      lg:grid-cols-4 обеспечивает аккуратную перестройку на мобильном и
      планшете. Typecheck, lint и build проходят."
  - id: task-5868
    title: Секции «Почему мы» и «Как мы работаем»
    description: >-
      Создать секцию «Почему мы» (id: why-us) с заголовком «Новый стандарт
      эффективности» и 5 преимуществами с иконками и цифрами:

      1. Прямой контакт с экспертом — «Никаких менеджеров и согласований. Вы
      общаетесь напрямую с тем, кто делает проект. Быстрые решения, точное
      понимание задачи.»

      2. Скорость ИИ — «Генерирую 30+ вариантов креативов и текстов за 2 часа
      вместо 2 недель. Быстрый запуск гипотез — вы опережаете конкурентов.»

      3. Один специалист вместо команды — «Не нужно искать дизайнера,
      таргетолога, модератора и разработчика. Весь digital-цикл закрывает один
      эксперт с нейросетями.»

      4. Прозрачность — «Дашборд с метриками в реальном времени. Вы видите
      каждый рубль рекламного бюджета.»

      5. Фокус на результат — «KPI фиксируем в договоре. Мне платят за лиды,
      регистрации и продажи, а не за красивые картинки.»

      Создать секцию «Как мы работаем» с заголовком «От идеи до результата за 5
      шагов» и 5 шагами: 1) Заявка — связь в течение 15 минут для брифинга; 2)
      Стратегия и бриф — анализ ниши, цели и KPI; 3) Прототип и концепция —
      структура и первые визуальные концепции с помощью ИИ; 4) Реализация —
      контент и кампании, еженедельные отчёты; 5) Поддержка и рост —
      сопровождение, анализ метрик, масштабирование успеха.
    status: completed
    acceptance_criteria:
      - Отображаются 5 преимуществ с иконками и конкретными цифрами по текстам
        брифа
      - Отображаются 5 шагов процесса с короткими описаниями по текстам брифа
      - Секции выдержаны в фирменном стиле Lilac Neon Edition
    summary: "Реализованы секции «Почему мы» (id: why-us) и «Как мы работаем» на
      лендинге Mentiforma. Секция why-us (components/why-us.tsx): заголовок
      «Новый стандарт эффективности» и 5 преимуществ с линейными иконками
      lucide-react, моноширинными номерами 01–05 и текстами с цифрами из брифа
      (30+, 2 часа, 2 недели). Секция процесса (components/how-we-work.tsx):
      заголовок «От идеи до результата за 5 шагов» и 5 шагов с иконками,
      номерами и короткими описаниями на тёмном градиенте с нейросетевым
      паттерном. Обе секции подключены в app/page.tsx в фирменном стиле Lilac
